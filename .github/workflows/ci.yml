name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: simply_clean
          POSTGRES_PASSWORD: simply_clean_ci
          POSTGRES_DB: simply_clean_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U simply_clean -d simply_clean_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - name: Verify PostgreSQL wire driver
        run: npm run test:integration -w @simply-clean/database
        env:
          RUN_POSTGRES_INTEGRATION: "true"
          NODE_ENV: test
          DATABASE_DRIVER: postgres
          DATABASE_URL: postgres://simply_clean:simply_clean_ci@localhost:5432/simply_clean_test
      - run: npm run build
