name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: laundrorama
          POSTGRES_PASSWORD: laundrorama_ci
          POSTGRES_DB: laundrorama_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U laundrorama -d laundrorama_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Verify PostgreSQL wire driver
        run: npm run test:integration -w @laundrorama/database
        env:
          RUN_POSTGRES_INTEGRATION: "true"
          NODE_ENV: test
          DATABASE_DRIVER: postgres
          DATABASE_URL: postgres://laundrorama:laundrorama_ci@localhost:5432/laundrorama_test
      - run: npm run build
